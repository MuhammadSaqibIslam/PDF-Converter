<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter - PDF Flare</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/tool.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo">PDF Flare</a>
            <nav class="main-nav">
                <a href="../index.html#all-tools">Tools</a>
                <a href="../pages/blog.html">Blog</a>
            </nav>
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main class="tool-page container">
        <a href="../index.html#all-tools" class="tool-back">&larr; Back to All Tools</a>
        <h1>Word Counter</h1>
        <p>Get live character, word, sentence, and paragraph counts with reading time.</p>

        <div class="control-group">
            <label for="textInput">Enter or paste your text</label>
            <textarea id="textInput" class="tool-textarea" rows="14" placeholder="Start typing or paste your text here..."></textarea>
        </div>

        <div class="output-area">
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;">
                <div class="stat-card">
                    <div class="stat-value" id="charCount">0</div>
                    <div class="stat-label">Characters</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="charNoSpace">0</div>
                    <div class="stat-label">Chars (no spaces)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="wordCount">0</div>
                    <div class="stat-label">Words</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="sentenceCount">0</div>
                    <div class="stat-label">Sentences</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="paragraphCount">0</div>
                    <div class="stat-label">Paragraphs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="readingTime">0 min</div>
                    <div class="stat-label">Reading Time</div>
                </div>
            </div>
        </div>

        <style>
            .stat-card { background: #f8f9fa; border-radius: 8px; padding: 15px; text-align: center; }
            .stat-value { font-size: 1.8rem; font-weight: 700; color: #2563eb; }
            .stat-label { font-size: 0.85rem; color: #666; margin-top: 4px; }
        </style>

        <div class="copy-feedback" id="copyFeedback">Copied to clipboard!</div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 PDF Flare. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/tool-common.js"></script>
    <script>
        const textInput = document.getElementById('textInput');

        function updateCounts() {
            const text = textInput.value;
            const trimmed = text.trim();

            // Characters
            document.getElementById('charCount').textContent = text.length;
            document.getElementById('charNoSpace').textContent = text.replace(/\s/g, '').length;

            // Words
            const words = trimmed ? trimmed.split(/\s+/).length : 0;
            document.getElementById('wordCount').textContent = words;

            // Sentences
            const sentences = trimmed ? (trimmed.match(/[.!?]+/g) || []).length || (trimmed.length > 0 ? 1 : 0) : 0;
            document.getElementById('sentenceCount').textContent = sentences;

            // Paragraphs
            const paragraphs = trimmed ? trimmed.split(/\n\s*\n/).filter(p => p.trim().length > 0).length || (trimmed.length > 0 ? 1 : 0) : 0;
            document.getElementById('paragraphCount').textContent = paragraphs;

            // Reading time (avg 200 words per minute)
            const minutes = Math.ceil(words / 200);
            document.getElementById('readingTime').textContent = minutes + ' min';
        }

        textInput.addEventListener('input', updateCounts);
        updateCounts();
    </script>
</body>
</html>
