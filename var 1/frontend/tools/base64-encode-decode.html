<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encode/Decode - PDF Forge</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/tool.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo">PDF Forge</a>
            <nav class="main-nav">
                <a href="../index.html#all-tools">Tools</a>
                <a href="../pages/blog.html">Blog</a>
            </nav>
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main class="tool-page container">
        <a href="../index.html#all-tools" class="tool-back">&larr; Back to All Tools</a>
        <h1>Base64 Encode / Decode</h1>
        <p>Encode text to Base64 or decode Base64 back to text.</p>

        <div class="tool-columns">
            <div class="control-group">
                <label for="textInput">Plain Text</label>
                <textarea id="textInput" class="tool-textarea" rows="10" placeholder="Enter text to encode..."></textarea>
                <div style="margin-top:10px;display:flex;gap:10px;">
                    <button id="encodeBtn" class="btn-tool">Encode &rarr;</button>
                    <button id="copyText" class="btn-secondary">Copy</button>
                </div>
            </div>
            <div class="control-group">
                <label for="base64Input">Base64</label>
                <textarea id="base64Input" class="tool-textarea" rows="10" placeholder="Enter Base64 to decode..."></textarea>
                <div style="margin-top:10px;display:flex;gap:10px;">
                    <button id="decodeBtn" class="btn-tool">&larr; Decode</button>
                    <button id="copyBase64" class="btn-secondary">Copy</button>
                </div>
            </div>
        </div>

        <div id="statusMsg" class="status-msg"></div>
        <div class="copy-feedback" id="copyFeedback">Copied to clipboard!</div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 PDF Forge. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/tool-common.js"></script>
    <script>
        const textInput = document.getElementById('textInput');
        const base64Input = document.getElementById('base64Input');
        const statusMsg = document.getElementById('statusMsg');
        const copyFeedback = document.getElementById('copyFeedback');

        document.getElementById('encodeBtn').addEventListener('click', function() {
            const text = textInput.value;
            if (!text) {
                ToolUtils.showStatus(statusMsg, 'Please enter text to encode.', 'error');
                return;
            }
            try {
                base64Input.value = btoa(unescape(encodeURIComponent(text)));
                ToolUtils.showStatus(statusMsg, 'Encoded successfully!', 'success');
            } catch (e) {
                ToolUtils.showStatus(statusMsg, 'Encoding error: ' + e.message, 'error');
            }
        });

        document.getElementById('decodeBtn').addEventListener('click', function() {
            const b64 = base64Input.value.trim();
            if (!b64) {
                ToolUtils.showStatus(statusMsg, 'Please enter Base64 to decode.', 'error');
                return;
            }
            try {
                textInput.value = decodeURIComponent(escape(atob(b64)));
                ToolUtils.showStatus(statusMsg, 'Decoded successfully!', 'success');
            } catch (e) {
                ToolUtils.showStatus(statusMsg, 'Invalid Base64: ' + e.message, 'error');
            }
        });

        document.getElementById('copyText').addEventListener('click', function() {
            ToolUtils.copyToClipboard(textInput.value, copyFeedback);
        });

        document.getElementById('copyBase64').addEventListener('click', function() {
            ToolUtils.copyToClipboard(base64Input.value, copyFeedback);
        });
    </script>
</body>
</html>
