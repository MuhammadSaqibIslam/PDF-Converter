<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Image - PDF Forge</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/tool.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo">PDF Forge</a>
            <nav class="main-nav">
                <a href="../index.html#all-tools">Tools</a>
                <a href="../pages/blog.html">Blog</a>
            </nav>
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main class="tool-page container">
        <a href="../index.html#all-tools" class="tool-back">&larr; Back to All Tools</a>
        <h1>Convert Image</h1>
        <p>Convert images between PNG, JPEG, and WebP formats.</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <p class="upload-text">Drop your image here or click to browse</p>
            <p class="upload-hint">Supports PNG, JPEG, WebP, GIF, BMP</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div id="editorSection" style="display:none;">
            <div style="margin-top:24px;">
                <div style="background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center;margin-bottom:20px;">
                    <img id="preview" style="max-width:100%;max-height:400px;border-radius:4px;" alt="Preview">
                    <p id="fileInfo" style="font-size:12px;color:var(--text-muted);margin-top:8px;"></p>
                </div>

                <div class="tool-controls" style="justify-content:center;">
                    <div class="control-group">
                        <label for="formatSelect">Convert to</label>
                        <select id="formatSelect">
                            <option value="image/png" data-ext=".png">PNG</option>
                            <option value="image/jpeg" data-ext=".jpg">JPEG</option>
                            <option value="image/webp" data-ext=".webp">WebP</option>
                        </select>
                    </div>
                </div>

                <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px;">
                    <button id="convertBtn" class="btn-tool">Convert</button>
                    <button id="downloadBtn" class="btn-tool btn-download" style="display:none;">Download</button>
                </div>
            </div>
        </div>

        <div id="statusMsg" class="status-msg"></div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 PDF Forge. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/tool-common.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const editorSection = document.getElementById('editorSection');
        const preview = document.getElementById('preview');
        const fileInfo = document.getElementById('fileInfo');
        const formatSelect = document.getElementById('formatSelect');
        const convertBtn = document.getElementById('convertBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusMsg = document.getElementById('statusMsg');

        let originalImage = null;
        let resultBlob = null;
        let previewURL = null;
        let originalFileName = '';
        let originalFileSize = 0;

        ToolUtils.setupDragDrop(uploadArea, (files) => handleFile(files[0]));

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) handleFile(fileInput.files[0]);
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                ToolUtils.showStatus(statusMsg, 'Please select a valid image file.', 'error');
                return;
            }
            ToolUtils.hideStatus(statusMsg);
            originalFileName = file.name.replace(/\.[^.]+$/, '');
            originalFileSize = file.size;

            if (previewURL) URL.revokeObjectURL(previewURL);
            previewURL = URL.createObjectURL(file);

            const img = new Image();
            img.onload = () => {
                originalImage = img;
                preview.src = previewURL;
                fileInfo.textContent = file.name + ' (' + ToolUtils.formatFileSize(file.size) + ', ' + img.width + 'x' + img.height + ')';
                editorSection.style.display = 'block';
                downloadBtn.style.display = 'none';
                resultBlob = null;
            };
            img.onerror = () => ToolUtils.showStatus(statusMsg, 'Failed to load image.', 'error');
            img.src = previewURL;
        }

        convertBtn.addEventListener('click', () => {
            if (!originalImage) return;

            const canvas = document.createElement('canvas');
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;
            const ctx = canvas.getContext('2d');

            const mimeType = formatSelect.value;

            // JPEG doesn't support transparency, fill white background
            if (mimeType === 'image/jpeg') {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.drawImage(originalImage, 0, 0);

            const quality = mimeType === 'image/png' ? undefined : 0.92;

            canvas.toBlob((blob) => {
                resultBlob = blob;
                if (previewURL) URL.revokeObjectURL(previewURL);
                previewURL = URL.createObjectURL(blob);
                preview.src = previewURL;

                const ext = formatSelect.options[formatSelect.selectedIndex].dataset.ext;
                fileInfo.textContent = originalFileName + ext + ' (' + ToolUtils.formatFileSize(blob.size) + ', ' + originalImage.width + 'x' + originalImage.height + ')';
                downloadBtn.style.display = 'inline-flex';
                ToolUtils.showStatus(statusMsg, 'Converted to ' + formatSelect.options[formatSelect.selectedIndex].text + ' (' + ToolUtils.formatFileSize(blob.size) + ')', 'success');
            }, mimeType, quality);
        });

        downloadBtn.addEventListener('click', () => {
            if (!resultBlob) return;
            const ext = formatSelect.options[formatSelect.selectedIndex].dataset.ext;
            ToolUtils.downloadBlob(resultBlob, originalFileName + ext);
        });
    </script>
</body>
</html>
