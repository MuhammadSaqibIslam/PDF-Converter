<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resize Image - PDF Forge</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/tool.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="../index.html" class="logo">PDF Forge</a>
            <nav class="main-nav">
                <a href="../index.html#all-tools">Tools</a>
                <a href="../pages/blog.html">Blog</a>
            </nav>
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main class="tool-page container">
        <a href="../index.html#all-tools" class="tool-back">&larr; Back to All Tools</a>
        <h1>Resize Image</h1>
        <p>Upload an image and resize it to your desired dimensions.</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <p class="upload-text">Drop your image here or click to browse</p>
            <p class="upload-hint">Supports PNG, JPEG, WebP, GIF, BMP</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div id="editorSection" style="display:none;">
            <div class="tool-columns" style="margin-top:24px;">
                <div>
                    <h3 style="font-size:14px;font-weight:600;margin-bottom:12px;">Preview</h3>
                    <div style="background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center;">
                        <img id="preview" style="max-width:100%;max-height:400px;border-radius:4px;" alt="Preview">
                        <p id="originalDims" style="font-size:12px;color:var(--text-muted);margin-top:8px;"></p>
                    </div>
                </div>
                <div>
                    <h3 style="font-size:14px;font-weight:600;margin-bottom:12px;">Resize Settings</h3>
                    <div class="control-group" style="margin-bottom:12px;">
                        <label for="widthInput">Width (px)</label>
                        <input type="number" id="widthInput" min="1" max="10000" placeholder="Width">
                    </div>
                    <div class="control-group" style="margin-bottom:12px;">
                        <label for="heightInput">Height (px)</label>
                        <input type="number" id="heightInput" min="1" max="10000" placeholder="Height">
                    </div>
                    <div class="control-group" style="margin-bottom:16px;">
                        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                            <input type="checkbox" id="lockRatio" checked style="width:auto;min-width:auto;">
                            Lock aspect ratio
                        </label>
                    </div>
                    <div id="sizeInfo" style="font-size:12px;color:var(--text-muted);margin-bottom:16px;"></div>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;">
                        <button id="resizeBtn" class="btn-tool">Resize</button>
                        <button id="downloadBtn" class="btn-tool btn-download" style="display:none;">Download</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="statusMsg" class="status-msg"></div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 PDF Forge. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/tool-common.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const editorSection = document.getElementById('editorSection');
        const preview = document.getElementById('preview');
        const originalDims = document.getElementById('originalDims');
        const widthInput = document.getElementById('widthInput');
        const heightInput = document.getElementById('heightInput');
        const lockRatio = document.getElementById('lockRatio');
        const resizeBtn = document.getElementById('resizeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const sizeInfo = document.getElementById('sizeInfo');
        const statusMsg = document.getElementById('statusMsg');

        let originalImage = null;
        let aspectRatio = 1;
        let resultBlob = null;
        let previewURL = null;
        let originalFileName = '';

        ToolUtils.setupDragDrop(uploadArea, (files) => handleFile(files[0]));

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) handleFile(fileInput.files[0]);
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                ToolUtils.showStatus(statusMsg, 'Please select a valid image file.', 'error');
                return;
            }
            ToolUtils.hideStatus(statusMsg);
            originalFileName = file.name.replace(/\.[^.]+$/, '');
            sizeInfo.textContent = 'Original size: ' + ToolUtils.formatFileSize(file.size);

            if (previewURL) URL.revokeObjectURL(previewURL);
            previewURL = URL.createObjectURL(file);

            const img = new Image();
            img.onload = () => {
                originalImage = img;
                aspectRatio = img.width / img.height;
                preview.src = previewURL;
                originalDims.textContent = img.width + ' x ' + img.height + ' px';
                widthInput.value = img.width;
                heightInput.value = img.height;
                editorSection.style.display = 'block';
                downloadBtn.style.display = 'none';
                resultBlob = null;
            };
            img.onerror = () => ToolUtils.showStatus(statusMsg, 'Failed to load image.', 'error');
            img.src = previewURL;
        }

        let updatingDims = false;
        widthInput.addEventListener('input', () => {
            if (updatingDims || !lockRatio.checked) return;
            updatingDims = true;
            const w = parseInt(widthInput.value);
            if (w > 0) heightInput.value = Math.round(w / aspectRatio);
            updatingDims = false;
        });
        heightInput.addEventListener('input', () => {
            if (updatingDims || !lockRatio.checked) return;
            updatingDims = true;
            const h = parseInt(heightInput.value);
            if (h > 0) widthInput.value = Math.round(h * aspectRatio);
            updatingDims = false;
        });

        resizeBtn.addEventListener('click', () => {
            if (!originalImage) return;
            const w = parseInt(widthInput.value);
            const h = parseInt(heightInput.value);
            if (!w || !h || w < 1 || h < 1) {
                ToolUtils.showStatus(statusMsg, 'Enter valid width and height values.', 'error');
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(originalImage, 0, 0, w, h);

            canvas.toBlob((blob) => {
                resultBlob = blob;
                if (previewURL) URL.revokeObjectURL(previewURL);
                previewURL = URL.createObjectURL(blob);
                preview.src = previewURL;
                originalDims.textContent = w + ' x ' + h + ' px';
                const info = sizeInfo.textContent.split('|')[0].trim();
                sizeInfo.textContent = info + ' | Resized: ' + ToolUtils.formatFileSize(blob.size);
                downloadBtn.style.display = 'inline-flex';
                ToolUtils.showStatus(statusMsg, 'Image resized to ' + w + 'x' + h + ' successfully!', 'success');
            }, 'image/png');
        });

        downloadBtn.addEventListener('click', () => {
            if (resultBlob) {
                ToolUtils.downloadBlob(resultBlob, originalFileName + '-resized.png');
            }
        });
    </script>
</body>
</html>
