<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/tool.css">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<header class="site-header"><div class="container header-inner"><a href="../index.html" class="logo"><svg class="logo-icon" width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#F97316"/><path d="M8 7h8a4 4 0 010 8h-3v6H9V7z" fill="#fff"/></svg><span class="logo-text">PDF <span class="logo-accent">Flare</span></span></a><nav class="main-nav" id="mainNav"><a href="../index.html#all-tools" class="nav-link">PDF Tools</a><a href="../index.html#all-tools" class="nav-link">Image Tools</a><a href="../index.html#all-tools" class="nav-link">JSON Tools</a><a href="../index.html#all-tools" class="nav-link">Dev Tools</a><a href="../index.html#all-tools" class="nav-link">Text Tools</a><a href="../pages/blog.html" class="nav-link">Blog</a></nav><div class="header-actions"><button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu" aria-expanded="false"><span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span></button></div></div></header>

<main><section class="tool-page"><div class="container">
    <a href="../index.html#all-tools" class="tool-back">&larr; Back to All Tools</a>
    <div class="tool-header"><h1>HTML to PDF</h1><p>Convert HTML pages to PDF format.</p></div>

    <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept=".html,.htm">
        <div class="upload-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
        <p class="upload-text">Drop an HTML file here or click to browse</p>
    </div>

    <div class="processing" id="processing"><div class="spinner"></div><p class="processing-text">Processing...</p></div>
    <div id="status" class="status-msg"></div>
    <div class="output-area" id="output" style="display:none;"></div>
</div></section></main>

<footer class="site-footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 PDF Forge. All rights reserved.</p></div></div></footer>
<script src="../js/tool-common.js"></script>
<script>
(function() {
    const { showStatus, setupDragDrop } = ToolUtils;
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const output = document.getElementById('output');

    setupDragDrop(uploadArea, fileInput, handleFile);
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

    function handleFile(file) {
        output.style.display = 'block';
        output.innerHTML =
            '<div class="status-msg info" style="display:block;">' +
            '<h3 style="margin-bottom:0.75rem;">Browser Limitation</h3>' +
            '<p>Converting HTML to PDF requires a full browser rendering engine to accurately process CSS, JavaScript, fonts, and page layout. This cannot be done reliably within a browser tab.</p>' +
            '<h4 style="margin:1rem 0 0.5rem;">Recommended Alternatives:</h4>' +
            '<ul style="margin:0.5rem 0; padding-left:1.5rem;">' +
            '<li><strong>Browser Print to PDF (best option)</strong> &mdash; Open the HTML file in your browser, then press Ctrl/Cmd + P and select "Save as PDF"</li>' +
            '<li><strong>wkhtmltopdf</strong> (free, open-source) &mdash; Command-line tool: <code>wkhtmltopdf page.html output.pdf</code></li>' +
            '<li><strong>Puppeteer / Playwright</strong> &mdash; Node.js tools that use a headless browser for pixel-perfect conversion</li>' +
            '<li><strong>Prince XML</strong> &mdash; Professional HTML/CSS to PDF converter</li>' +
            '</ul>' +
            '<p style="margin-top:1rem;">Your browser\'s built-in Print to PDF is the quickest and most accurate method for most use cases.</p>' +
            '</div>';
        showStatus('HTML to PDF conversion is not supported in the browser. See recommendations below.', 'info');
    }
})();
</script>
</body>
</html>
