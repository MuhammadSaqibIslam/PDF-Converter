<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit PDF - PDF Flare</title>
    <link rel="stylesheet" href="../css/page-v2.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
/* When editor is active, go full-viewport */
body.editor-active .tool-page{padding:0}
body.editor-active .tool-page>.container{max-width:100%;padding:0}
body.editor-active .tool-back,
body.editor-active .tool-header{display:none}
body.editor-active .site-footer{display:none}
body.editor-active .upload-area{max-width:600px;margin:80px auto;padding:48px 24px}

/* ===== Editor Shell ===== */
.editor-wrap{display:none}
.editor-shell{display:flex;flex-direction:column;height:calc(100vh - 57px);overflow:hidden;background:var(--bg-panel)}

/* ===== Toolbar ===== */
.ed-toolbar{display:flex;align-items:center;height:40px;padding:0 8px;background:var(--bg-page);border-bottom:1px solid var(--border);gap:2px;flex-shrink:0;overflow-x:auto;overflow-y:hidden}
.ed-toolbar::-webkit-scrollbar{height:0}
.ed-toolbar .tbtn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:transparent;border:1px solid transparent;border-radius:4px;color:var(--text-secondary);font-size:12px;font-family:var(--font);cursor:pointer;white-space:nowrap;transition:all .12s;height:30px;line-height:1}
.ed-toolbar .tbtn:hover{color:var(--text-primary);background:var(--bg-surface)}
.ed-toolbar .tbtn.active{color:#fff;background:var(--accent);border-color:var(--accent)}
.ed-toolbar .tbtn svg{width:14px;height:14px;flex-shrink:0}
.ed-toolbar .tbtn:disabled{opacity:.35;cursor:default}
.ed-toolbar .sep{width:1px;height:20px;background:var(--border);margin:0 3px;flex-shrink:0}
.ed-toolbar .spacer{flex:1;min-width:8px}
.ed-toolbar .zlbl{font-size:12px;color:var(--text-secondary);min-width:38px;text-align:center;user-select:none}
.ed-toolbar .plbl{font-size:12px;color:var(--text-secondary);white-space:nowrap;user-select:none}
.ed-toolbar .save-btn{padding:5px 16px;background:var(--accent);color:#fff;border:none;border-radius:4px;font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;white-space:nowrap;height:30px;transition:background .15s}
.ed-toolbar .save-btn:hover{background:var(--accent-hover)}

/* ===== Body: sidebar + workspace + props ===== */
.ed-body{display:flex;flex:1;overflow:hidden}

/* Sidebar */
.ed-sidebar{width:64px;min-width:64px;overflow-y:auto;background:var(--bg-panel);border-right:1px solid var(--border);padding:6px}
.ed-sidebar::-webkit-scrollbar{width:4px}
.ed-sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.thumb-item{position:relative;margin-bottom:6px;cursor:pointer;border:2px solid transparent;border-radius:3px;overflow:hidden;transition:border-color .12s}
.thumb-item.active{border-color:var(--accent)}
.thumb-item:hover:not(.active){border-color:var(--border-light)}
.thumb-item canvas{width:100%;display:block}
.thumb-label{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:9px;color:#ccc;background:rgba(0,0,0,.55);padding:1px 0}

/* Workspace */
.ed-workspace{flex:1;overflow:auto;background:#525659;position:relative;display:flex;align-items:flex-start;justify-content:center;padding:20px}
.canvas-stack{position:relative;display:inline-block;box-shadow:0 2px 16px rgba(0,0,0,.35);flex-shrink:0}
.canvas-stack canvas{display:block}
#overlayCanvas{position:absolute;top:0;left:0}
.el-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden}

/* Element boxes */
.el-box{position:absolute;pointer-events:auto;cursor:move;user-select:none}
.el-box.selected{outline:2px solid var(--accent);outline-offset:1px}
.el-box .el-handle{position:absolute;width:9px;height:9px;background:var(--accent);border:1px solid #fff;border-radius:1px;display:none}
.el-box.selected .el-handle{display:block}
.el-box .el-handle.se{right:-5px;bottom:-5px;cursor:nwse-resize}
.el-box .el-handle.ne{right:-5px;top:-5px;cursor:nesw-resize}
.el-box .el-handle.sw{left:-5px;bottom:-5px;cursor:nesw-resize}
.el-box .el-handle.nw{left:-5px;top:-5px;cursor:nw-resize}

/* Properties Panel */
.ed-props{width:200px;min-width:200px;overflow-y:auto;background:var(--bg-panel);border-left:1px solid var(--border);padding:14px 12px;font-size:12px}
.ed-props::-webkit-scrollbar{width:4px}
.ed-props::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.ed-props h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin-bottom:12px}
.ed-props .pg{margin-bottom:10px}
.ed-props .pg label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:3px}
.ed-props .pg input,.ed-props .pg select,.ed-props .pg textarea{width:100%;padding:5px 7px;background:var(--bg-surface);border:1px solid var(--border);border-radius:4px;color:var(--text-primary);font-size:12px;font-family:var(--font)}
.ed-props .pg input[type="color"]{height:28px;padding:2px;cursor:pointer}
.ed-props .pg input[type="range"]{padding:0;accent-color:var(--accent)}
.ed-props .pg textarea{min-height:46px;resize:vertical}
.ed-props .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ed-props .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.ed-props .pbtn{display:block;width:100%;padding:7px;margin-top:6px;border:1px solid var(--border);border-radius:4px;background:var(--bg-surface);color:var(--text-primary);font-size:12px;font-family:var(--font);cursor:pointer;text-align:center;transition:all .12s}
.ed-props .pbtn:hover{border-color:var(--accent);color:var(--accent)}
.ed-props .pbtn.danger{color:var(--red)}
.ed-props .pbtn.danger:hover{border-color:var(--red);background:rgba(248,113,113,.08)}
.ed-props .hint{color:var(--text-muted);font-size:11px;line-height:1.5;margin-top:10px}
.ed-props .style-row{display:flex;gap:4px;margin-bottom:10px}
.ed-props .style-row button{flex:1;padding:5px;background:var(--bg-surface);border:1px solid var(--border);border-radius:4px;color:var(--text-secondary);cursor:pointer;font-size:13px;font-family:var(--font);transition:all .12s}
.ed-props .style-row button:hover{border-color:var(--accent)}
.ed-props .style-row button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Color swatch grid */
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:10px}
.color-swatch{width:100%;aspect-ratio:1;border-radius:3px;border:2px solid transparent;cursor:pointer;transition:border-color .1s}
.color-swatch:hover{border-color:var(--text-muted)}
.color-swatch.active{border-color:var(--accent)}

/* Shapes dropdown */
.shapes-dropdown{position:relative}
.shapes-menu{display:none;position:absolute;top:100%;left:0;margin-top:4px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;padding:4px;z-index:50;min-width:140px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.shapes-menu.open{display:block}
.shapes-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;background:transparent;border:none;border-radius:4px;color:var(--text-secondary);font-size:12px;font-family:var(--font);cursor:pointer}
.shapes-menu button:hover{background:var(--bg-surface);color:var(--text-primary)}

/* Sign modal */
.sign-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
.sign-modal-bg.open{display:flex}
.sign-modal{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:460px;max-width:90vw}
.sign-modal h3{margin-bottom:12px;font-size:16px}
.sign-tabs{display:flex;gap:8px;margin-bottom:12px}
.sign-tabs button{flex:1;padding:8px;background:var(--bg-surface);border:1px solid var(--border);border-radius:4px;color:var(--text-secondary);font-size:13px;cursor:pointer;font-family:var(--font)}
.sign-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sign-canvas-wrap{border:2px solid var(--border);border-radius:6px;overflow:hidden;background:#fff;margin-bottom:12px}
.sign-canvas-wrap canvas{display:block;width:100%;cursor:crosshair;touch-action:none}
.sign-type-input{width:100%;padding:10px;font-size:24px;font-family:'Brush Script MT','Segoe Script',cursive;background:var(--bg-surface);border:1px solid var(--border);border-radius:4px;color:var(--text-primary);margin-bottom:12px}
.sign-upload-area{border:2px dashed var(--border);border-radius:6px;padding:24px;text-align:center;cursor:pointer;margin-bottom:12px;color:var(--text-muted);font-size:13px;position:relative}
.sign-upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sign-actions{display:flex;gap:8px;justify-content:flex-end}
.sign-actions button{padding:8px 18px;border-radius:4px;font-size:13px;font-family:var(--font);cursor:pointer;border:1px solid var(--border)}
.sign-preview{max-width:100%;max-height:80px;margin:8px auto;display:block}

/* Processing overlay */
.processing{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4)}
.processing.visible{display:flex}

@media(max-width:768px){
    .ed-sidebar{width:48px;min-width:48px;padding:4px}
    .ed-props{width:160px;min-width:160px;padding:10px 8px}
    .ed-toolbar{gap:1px}
    .ed-toolbar .tbtn{padding:4px 6px;font-size:11px}
}
@media(max-width:560px){
    .ed-body{flex-direction:column}
    .ed-sidebar{width:100%;min-width:auto;flex-direction:row;display:flex;overflow-x:auto;overflow-y:hidden;border-right:none;border-bottom:1px solid var(--border);height:60px;padding:4px;gap:4px}
    .thumb-item{flex-shrink:0;width:40px;margin:0}
    .ed-props{width:100%;min-width:auto;border-left:none;border-top:1px solid var(--border);max-height:200px}
}
</style>
</head>
<body>

<main><section class="tool-page"><div class="container">
    <a href="../v2.html" class="pf-tool-back">&larr; Back to All Tools</a>
    <div class="tool-header"><h1>Edit PDF</h1><p>Professional PDF editor. Existing PDF text cannot be directly edited in the browser.</p></div>

    <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept=".pdf">
        <div class="upload-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
        <p class="upload-text">Drop a PDF file here or click to browse</p>
    </div>

    <div class="editor-wrap" id="editorWrap">
        <div class="editor-shell">
            <!-- TOOLBAR -->
            <div class="ed-toolbar" id="toolbar">
                <button class="tbtn active" data-tool="select" title="Select (V)">Select</button>
                <button class="tbtn" data-tool="edittext" title="Edit Text">Edit Text</button>
                <button class="tbtn" data-tool="text" title="Add Text (T)">Text</button>
                <button class="tbtn" data-tool="image" title="Insert Image (I)">Image</button>
                <div class="shapes-dropdown">
                    <button class="tbtn" data-tool="shape" title="Draw Shape (S)">Shapes <span style="font-size:9px">&#9662;</span></button>
                    <div class="shapes-menu" id="shapesMenu">
                        <button data-shape="rect">Rectangle</button>
                        <button data-shape="roundrect">Rounded Rect</button>
                        <button data-shape="ellipse">Ellipse</button>
                        <button data-shape="line">Line</button>
                        <button data-shape="arrow">Arrow</button>
                    </div>
                </div>
                <button class="tbtn" data-tool="draw" title="Freehand Draw (D)">Draw</button>
                <button class="tbtn" data-tool="sign" title="Signature">Sign</button>
                <button class="tbtn" data-tool="highlight" title="Highlight (H)">Highlight</button>
                <button class="tbtn" data-tool="whiteout" title="Whiteout (W)">Whiteout</button>
                <div class="sep"></div>
                <button class="tbtn" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
                <button class="tbtn" id="redoBtn" title="Redo (Ctrl+Y)">Redo</button>

                <div class="spacer"></div>

                <!-- Zoom -->
                <button class="tbtn" id="zoomFit" title="Fit Width" style="font-size:14px">&#x2922;</button>
                <button class="tbtn" id="zoomOut" title="Zoom Out">-</button>
                <span class="zlbl" id="zoomLabel">125%</span>
                <button class="tbtn" id="zoomIn" title="Zoom In">+</button>
                <div class="sep"></div>
                <!-- Page nav -->
                <button class="tbtn" id="prevPage" title="Previous Page">&#9664;</button>
                <span class="plbl"><span id="pageDisplay">1</span> / <span id="totalPagesLabel">1</span></span>
                <button class="tbtn" id="nextPage" title="Next Page">&#9654;</button>
                <div class="sep"></div>
                <button class="tbtn" id="resetBtn" title="Start Over">Reset</button>
                <button class="save-btn" id="saveBtn">Save &amp; Download</button>
            </div>

            <!-- BODY -->
            <div class="ed-body">
                <!-- PAGE SIDEBAR -->
                <div class="ed-sidebar" id="pageSidebar"></div>

                <!-- WORKSPACE -->
                <div class="ed-workspace" id="workspace">
                    <div class="canvas-stack" id="canvasStack">
                        <canvas id="pdfCanvas"></canvas>
                        <canvas id="overlayCanvas"></canvas>
                        <div class="el-overlay" id="elOverlay"></div>
                    </div>
                </div>

                <!-- PROPERTIES PANEL -->
                <div class="ed-props" id="propsPanel">
                    <div id="propsContent"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="processing" id="processing"><div class="spinner"></div><p class="processing-text">Processing...</p></div>
    <div id="status" class="status-msg"></div>
    <div class="output-area" id="output" style="display:none;"></div>
</div></section></main>

<!-- SIGNATURE MODAL -->
<div class="sign-modal-bg" id="signModal">
    <div class="sign-modal">
        <h3>Add Signature</h3>
        <div class="sign-tabs">
            <button class="active" data-tab="draw">Draw</button>
            <button data-tab="type">Type</button>
            <button data-tab="upload">Upload</button>
        </div>
        <div id="signDrawTab">
            <div class="sign-canvas-wrap"><canvas id="signCanvas" width="420" height="120"></canvas></div>
            <button class="pbtn" id="signClear" style="width:auto;display:inline-block;margin-bottom:8px;padding:6px 14px;background:var(--bg-surface);border:1px solid var(--border);border-radius:4px;color:var(--text-primary);font-size:12px;cursor:pointer">Clear</button>
        </div>
        <div id="signTypeTab" style="display:none">
            <input type="text" class="sign-type-input" id="signTypeInput" placeholder="Your Name">
        </div>
        <div id="signUploadTab" style="display:none">
            <div class="sign-upload-area" id="signUploadArea">
                <input type="file" id="signFileInput" accept="image/*">
                Click or drop an image file
            </div>
            <img id="signUploadPreview" class="sign-preview" style="display:none">
        </div>
        <div class="sign-actions">
            <button id="signCancel" style="background:var(--bg-surface);color:var(--text-primary)">Cancel</button>
            <button id="signConfirm" style="background:var(--accent);color:#fff">Place Signature</button>
        </div>
    </div>
</div>
<script src="../js/tool-common.js"></script>
<script>
(function(){
'use strict';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const COLORS=['#000000','#434343','#666666','#999999','#b7b7b7','#cccccc',
    '#d32f2f','#e64a19','#f57c00','#fbc02d','#388e3c','#1976d2',
    '#7b1fa2','#c2185b','#00838f','#558b2f','#ef6c00','#ad1457',
    '#ffffff','#f5f5f5','#e0e0e0','#bdbdbd','#9e9e9e','#757575'];

/* ===== STATE ===== */
const S={
    pdfBytes:null, pdfDoc:null, fileName:'', totalPages:0,
    page:1, zoom:1.25, activeTool:'select', shapeType:'rect',
    elements:[], selectedId:null,
    undoStack:[], redoStack:[],
    pageRotations:{},
    isDragging:false, isResizing:false, isDrawing:false,
    drawPoints:[],
    dragStart:null, resizeStart:null, origEl:null,
    signData:null, signTab:'draw',
    _idCounter:0,
    nextId(){ return ++this._idCounter; }
};

/* ===== DOM REFS ===== */
const $=id=>document.getElementById(id);
const statusEl=$('status'), uploadArea=$('uploadArea'), fileInput=$('fileInput'),
      editorWrap=$('editorWrap'), processing=$('processing'), output=$('output'),
      pdfCanvas=$('pdfCanvas'), overlayCanvas=$('overlayCanvas'), elOverlay=$('elOverlay'),
      workspace=$('workspace'), pageSidebar=$('pageSidebar'), propsPanel=$('propsContent'),
      canvasStack=$('canvasStack');

/* ===== FILE LOADING ===== */
ToolUtils.setupDragDrop(uploadArea, fileInput, handleFile);
fileInput.addEventListener('change',()=>{if(fileInput.files[0])handleFile(fileInput.files[0]);});

async function handleFile(file){
    if(file.type!=='application/pdf'){ToolUtils.showStatus(statusEl,'Please select a valid PDF file.','error');return;}
    ToolUtils.hideStatus(statusEl);
    S.fileName=file.name;
    S.pdfBytes=await file.arrayBuffer();
    try{
        S.pdfDoc=await pdfjsLib.getDocument({data:S.pdfBytes}).promise;
        S.totalPages=S.pdfDoc.numPages;
        S.page=1; S.zoom=1.25; S.elements=[]; S.selectedId=null;
        S.undoStack=[]; S.redoStack=[]; S.pageRotations={}; S._idCounter=0;
        document.body.classList.add('editor-active');
        uploadArea.style.display='none';
        editorWrap.style.display='block';
        output.style.display='none';
        $('totalPagesLabel').textContent=S.totalPages;
        await buildThumbnails();
        await renderPage();
        updateProps();
    }catch(e){ToolUtils.showStatus(statusEl,'Failed to read PDF: '+e.message,'error');}
}

/* ===== THUMBNAIL SIDEBAR ===== */
async function buildThumbnails(){
    pageSidebar.innerHTML='';
    for(let i=1;i<=S.totalPages;i++){
        const page=await S.pdfDoc.getPage(i);
        const vp=page.getViewport({scale:0.2});
        const c=document.createElement('canvas');
        c.width=vp.width; c.height=vp.height;
        const ctx=c.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
        await page.render({canvasContext:ctx,viewport:vp}).promise;
        const div=document.createElement('div');
        div.className='thumb-item'+(i===S.page?' active':'');
        div.dataset.page=i;
        div.appendChild(c);
        const lbl=document.createElement('div');
        lbl.className='thumb-label'; lbl.textContent=i;
        div.appendChild(lbl);
        div.addEventListener('click',()=>{S.page=i;S.selectedId=null;renderPage();updateProps();});
        pageSidebar.appendChild(div);
    }
}

function updateThumbActive(){
    pageSidebar.querySelectorAll('.thumb-item').forEach(t=>{
        t.classList.toggle('active',parseInt(t.dataset.page)===S.page);
    });
}

/* ===== RENDER PAGE ===== */
let renderTask=null;
async function renderPage(){
    if(renderTask){renderTask.cancel();renderTask=null;}
    const page=await S.pdfDoc.getPage(S.page);
    const rot=S.pageRotations[S.page]||0;
    const scale=S.zoom*1.5;
    const vp=page.getViewport({scale,rotation:rot});
    pdfCanvas.width=vp.width; pdfCanvas.height=vp.height;
    overlayCanvas.width=vp.width; overlayCanvas.height=vp.height;
    const ctx=pdfCanvas.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,vp.width,vp.height);
    renderTask=page.render({canvasContext:ctx,viewport:vp});
    try{await renderTask.promise;}catch(e){if(e.name!=='RenderingCancelled')throw e;}
    renderTask=null;
    renderOverlay();
    renderElements();
    updatePageUI();
    updateThumbActive();
}

async function getPageSize(){
    const page=await S.pdfDoc.getPage(S.page);
    const vp=page.getViewport({scale:1,rotation:S.pageRotations[S.page]||0});
    return{w:vp.width,h:vp.height};
}

function pdfScale(){return S.zoom*1.5;}

function canvasToPage(cx,cy){const s=pdfScale();return{x:cx/s,y:cy/s};}
function eventToCanvas(e){const r=overlayCanvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function eventToPage(e){const c=eventToCanvas(e);return canvasToPage(c.x,c.y);}

/* ===== OVERLAY ===== */
function renderOverlay(){
    const ctx=overlayCanvas.getContext('2d');
    ctx.clearRect(0,0,overlayCanvas.width,overlayCanvas.height);
    const s=pdfScale();
    if(S.isDrawing && S.drawPoints.length>1){
        ctx.beginPath();
        ctx.strokeStyle=S.activeTool==='highlight'?'rgba(255,235,59,0.4)':S._drawColor||'#000';
        ctx.lineWidth=(S.activeTool==='highlight'?16:S._drawWidth||2)*s;
        ctx.lineCap='round';ctx.lineJoin='round';
        if(S.activeTool==='highlight') ctx.globalAlpha=0.4;
        ctx.moveTo(S.drawPoints[0].x*s,S.drawPoints[0].y*s);
        for(let i=1;i<S.drawPoints.length;i++) ctx.lineTo(S.drawPoints[i].x*s,S.drawPoints[i].y*s);
        ctx.stroke();ctx.globalAlpha=1;
    }
    if(S.isDragging && (S.activeTool==='shape') && S.dragStart && S._shapeEnd){
        drawShapePreview(ctx,s);
    }
    if(S.isDragging && S.activeTool==='whiteout' && S.dragStart && S._shapeEnd){
        const x1=S.dragStart.x*s,y1=S.dragStart.y*s,x2=S._shapeEnd.x*s,y2=S._shapeEnd.y*s;
        ctx.fillStyle='#fff';ctx.fillRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));
        ctx.strokeStyle='#ccc';ctx.lineWidth=1;ctx.strokeRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));
    }
}

function drawShapePreview(ctx,s){
    const x1=S.dragStart.x*s,y1=S.dragStart.y*s,x2=S._shapeEnd.x*s,y2=S._shapeEnd.y*s;
    const fill=S._fillColor||'#ffffff',stroke=S._strokeColor||'#000000';
    const lw=(S._strokeWidth||2)*s;

/* ===== ELEMENT RENDERING ===== */
function renderElements(){
    elOverlay.innerHTML='';
    const s=pdfScale();
    pageElements().forEach(el=>{
        if(el.type==='text') renderTextEl(el,s);
        else if(el.type==='image'||el.type==='signature') renderImageEl(el,s);
        else if(el.type==='shape') renderShapeEl(el,s);
        else if(el.type==='draw'||el.type==='highlight') renderDrawEl(el,s);
        else if(el.type==='whiteout') renderWhiteoutEl(el,s);
    });
}

function pageElements(){return S.elements.filter(e=>e.page===S.page);}
function elById(id){return S.elements.find(e=>e.id===id);}

function makeElBox(el,s,w,h){
    const div=document.createElement('div');
    div.className='el-box'+(S.selectedId===el.id?' selected':'');
    div.dataset.id=el.id;
    div.style.left=(el.x*s)+'px';div.style.top=(el.y*s)+'px';
    div.style.width=(w*s)+'px';div.style.height=(h*s)+'px';
    if(el.opacity!==undefined) div.style.opacity=el.opacity;
    if(el.rotation) div.style.transform='rotate('+el.rotation+'deg)';
    ['se','ne','sw','nw'].forEach(pos=>{const h2=document.createElement('div');h2.className='el-handle '+pos;h2.dataset.handle=pos;div.appendChild(h2);});
    return div;
}

function renderTextEl(el,s){
    const div=makeElBox(el,s,el.w||120,el.h||30);
    const inner=document.createElement('div');
    inner.style.cssText='width:100%;height:100%;overflow:hidden;white-space:pre-wrap;word-break:break-word;pointer-events:none;padding:2px;';
    inner.style.fontFamily=el.fontFamily||'Helvetica, Arial, sans-serif';
    inner.style.fontSize=(el.fontSize||16)*s+'px';
    inner.style.fontWeight=el.bold?'bold':'normal';
    inner.style.fontStyle=el.italic?'italic':'normal';
    inner.style.textDecoration=el.underline?'underline':'none';
    inner.style.color=el.color||'#000000';
    inner.style.textAlign=el.align||'left';
    inner.style.lineHeight=(el.lineHeight||1.3)+'';
    inner.textContent=el.text||'Type here';
    div.appendChild(inner);
    elOverlay.appendChild(div);
}
function renderImageEl(el,s){
    const div=makeElBox(el,s,el.w||100,el.h||100);
    const img=document.createElement('img');
    img.src=el.dataUrl;img.style.cssText='width:100%;height:100%;object-fit:contain;pointer-events:none;display:block;';img.draggable=false;
    div.appendChild(img);elOverlay.appendChild(div);
}
function renderShapeEl(el,s){
    const div=makeElBox(el,s,el.w||50,el.h||50);
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width','100%');svg.setAttribute('height','100%');
    svg.style.cssText='pointer-events:none;position:absolute;top:0;left:0;';
    svg.setAttribute('viewBox','0 0 '+(el.w*s)+' '+(el.h*s));
    const w2=el.w*s,h2=el.h*s;let shape;
    if(el.shapeType==='rect'){shape=document.createElementNS('http://www.w3.org/2000/svg','rect');shape.setAttribute('x',el.strokeWidth*s/2);shape.setAttribute('y',el.strokeWidth*s/2);shape.setAttribute('width',Math.max(0,w2-el.strokeWidth*s));shape.setAttribute('height',Math.max(0,h2-el.strokeWidth*s));}
    else if(el.shapeType==='roundrect'){shape=document.createElementNS('http://www.w3.org/2000/svg','rect');shape.setAttribute('x',el.strokeWidth*s/2);shape.setAttribute('y',el.strokeWidth*s/2);shape.setAttribute('width',Math.max(0,w2-el.strokeWidth*s));shape.setAttribute('height',Math.max(0,h2-el.strokeWidth*s));shape.setAttribute('rx',Math.min(12,el.w/4)*s);}
    else if(el.shapeType==='ellipse'){shape=document.createElementNS('http://www.w3.org/2000/svg','ellipse');shape.setAttribute('cx',w2/2);shape.setAttribute('cy',h2/2);shape.setAttribute('rx',Math.max(0,w2/2-el.strokeWidth*s/2));shape.setAttribute('ry',Math.max(0,h2/2-el.strokeWidth*s/2));}
    else if(el.shapeType==='line'){shape=document.createElementNS('http://www.w3.org/2000/svg','line');shape.setAttribute('x1',0);shape.setAttribute('y1',h2);shape.setAttribute('x2',w2);shape.setAttribute('y2',0);}
    else if(el.shapeType==='arrow'){shape=document.createElementNS('http://www.w3.org/2000/svg','line');shape.setAttribute('x1',0);shape.setAttribute('y1',h2);shape.setAttribute('x2',w2);shape.setAttribute('y2',0);shape.setAttribute('marker-end','url(#arr)');const d=document.createElementNS('http://www.w3.org/2000/svg','defs'),m=document.createElementNS('http://www.w3.org/2000/svg','marker');m.setAttribute('id','arr');m.setAttribute('viewBox','0 0 10 10');m.setAttribute('refX','10');m.setAttribute('refY','5');m.setAttribute('markerWidth','8');m.setAttribute('markerHeight','8');m.setAttribute('orient','auto-start-reverse');const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M0 0L10 5L0 10z');p.setAttribute('fill',el.strokeColor||'#000');m.appendChild(p);d.appendChild(m);svg.appendChild(d);}
    if(shape){shape.setAttribute('fill',el.fillColor||'transparent');shape.setAttribute('stroke',el.strokeColor||'#000');shape.setAttribute('stroke-width',el.strokeWidth*s);if(el.fillOpacity!==undefined)shape.setAttribute('fill-opacity',el.fillOpacity);svg.appendChild(shape);}

}
function renderDrawEl(el,s){
    if(!el.points||el.points.length<2) return;
    const ctx=overlayCanvas.getContext('2d');
    ctx.save();
    if(el.type==='highlight') ctx.globalAlpha=el.opacity||0.4;
    else if(el.opacity!==undefined) ctx.globalAlpha=el.opacity;
    ctx.beginPath();ctx.strokeStyle=el.color||'#000';ctx.lineWidth=(el.width||2)*s;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.moveTo(el.points[0].x*s,el.points[0].y*s);
    for(let i=1;i<el.points.length;i++) ctx.lineTo(el.points[i].x*s,el.points[i].y*s);
    ctx.stroke();ctx.restore();
    if(S.selectedId===el.id){const xs=el.points.map(p=>p.x),ys=el.points.map(p=>p.y);const bx=Math.min(...xs),by=Math.min(...ys);ctx.save();ctx.strokeStyle='#F97316';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.strokeRect(bx*s-2,by*s-2,(Math.max(...xs)-bx)*s+4,(Math.max(...ys)-by)*s+4);ctx.restore();}
}
function renderWhiteoutEl(el,s){
    const div=makeElBox(el,s,el.w||50,el.h||50);
    const inner=document.createElement('div');inner.style.cssText='width:100%;height:100%;pointer-events:none;';inner.style.backgroundColor=el.fillColor||'#fff';
    div.appendChild(inner);elOverlay.appendChild(div);
}

/* ===== UNDO/REDO ===== */
function pushUndo(){S.undoStack.push(JSON.parse(JSON.stringify(S.elements)));S.redoStack=[];if(S.undoStack.length>50)S.undoStack.shift();updateUndoRedoState();}
function undo(){if(!S.undoStack.length)return;S.redoStack.push(JSON.parse(JSON.stringify(S.elements)));S.elements=S.undoStack.pop();S.selectedId=null;renderPage();updateProps();updateUndoRedoState();}
function redo(){if(!S.redoStack.length)return;S.undoStack.push(JSON.parse(JSON.stringify(S.elements)));S.elements=S.redoStack.pop();S.selectedId=null;renderPage();updateProps();updateUndoRedoState();}

/* ===== TOOL SELECTION ===== */
S._drawColor='#000000'; S._drawWidth=2; S._strokeColor='#000000'; S._fillColor='#ffffff'; S._strokeWidth=2;

document.querySelectorAll('.tbtn[data-tool]').forEach(btn=>{
    btn.addEventListener('click',()=>{
        const tool=btn.dataset.tool;
        if(tool==='sign'){openSignModal();return;}
        if(tool==='image'){triggerImageUpload();return;}
        setTool(tool);
    });
});

function setTool(t){
    S.activeTool=t;
    document.querySelectorAll('.tbtn[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
    updateCursor();
    if(t!=='select'&&t!=='edittext') S.selectedId=null;
    updateProps();renderElements();updateUndoRedoState();
    $('shapesMenu').classList.remove('open');
}

function updateUndoRedoState(){
    $('undoBtn').disabled=!S.undoStack.length;
    $('redoBtn').disabled=!S.redoStack.length;
}

function updateCursor(){
    const c=overlayCanvas;
    switch(S.activeTool){
        case'select':case'edittext':c.style.cursor='default';break;
        case'text':c.style.cursor='text';break;
        default:c.style.cursor='crosshair';
    }
}

document.querySelector('.shapes-dropdown .tbtn').addEventListener('click',e=>{e.stopPropagation();$('shapesMenu').classList.toggle('open');});
document.querySelectorAll('#shapesMenu button').forEach(btn=>{btn.addEventListener('click',()=>{S.shapeType=btn.dataset.shape;setTool('shape');});});
document.addEventListener('click',()=>$('shapesMenu').classList.remove('open'));

/* ===== WORKSPACE EVENTS ===== */
elOverlay.addEventListener('pointerdown',onPointerDown);
elOverlay.addEventListener('pointermove',onPointerMove);
elOverlay.addEventListener('pointerup',onPointerUp);
overlayCanvas.addEventListener('pointerdown',onCanvasPointerDown);
overlayCanvas.addEventListener('pointermove',onCanvasPointerMove);
overlayCanvas.addEventListener('pointerup',onCanvasPointerUp);
workspace.addEventListener('touchmove',e=>{if(S.isDrawing||S.isDragging||S.isResizing)e.preventDefault();},{passive:false});

function onPointerDown(e){
    const box=e.target.closest('.el-box'),handle=e.target.closest('.el-handle');
    if(handle&&box){e.preventDefault();e.stopPropagation();const el=elById(parseInt(box.dataset.id));if(!el)return;S.selectedId=el.id;S.isResizing=true;S.resizeHandle=handle.dataset.handle;S.resizeStart=eventToPage(e);S.origEl=JSON.parse(JSON.stringify(el));pushUndo();elOverlay.setPointerCapture(e.pointerId);renderElements();updateProps();return;}
    if(box&&(S.activeTool==='select'||S.activeTool==='edittext')){e.preventDefault();e.stopPropagation();const el=elById(parseInt(box.dataset.id));if(!el)return;S.selectedId=el.id;S.isDragging=true;S.dragStart=eventToPage(e);S.origEl=JSON.parse(JSON.stringify(el));pushUndo();elOverlay.setPointerCapture(e.pointerId);renderElements();updateProps();
        // Edit Text tool: auto-start inline editing on click
        if(S.activeTool==='edittext'&&el.type==='text'){setTimeout(()=>{const b2=elOverlay.querySelector('[data-id="'+el.id+'"]');if(b2)startTextEdit(el,b2);},100);}
        return;}
}
function onPointerMove(e){
    if(S.isDragging&&S.origEl){const pos=eventToPage(e);const el=elById(S.selectedId);if(!el)return;el.x=S.origEl.x+(pos.x-S.dragStart.x);el.y=S.origEl.y+(pos.y-S.dragStart.y);renderElements();}
    if(S.isResizing&&S.origEl){const pos=eventToPage(e);const el=elById(S.selectedId);if(!el)return;const dx=pos.x-S.resizeStart.x,dy=pos.y-S.resizeStart.y,h=S.resizeHandle;if(h==='se'){el.w=Math.max(10,S.origEl.w+dx);el.h=Math.max(10,S.origEl.h+dy);}else if(h==='ne'){el.w=Math.max(10,S.origEl.w+dx);el.y=S.origEl.y+dy;el.h=Math.max(10,S.origEl.h-dy);}else if(h==='sw'){el.x=S.origEl.x+dx;el.w=Math.max(10,S.origEl.w-dx);el.h=Math.max(10,S.origEl.h+dy);}else if(h==='nw'){el.x=S.origEl.x+dx;el.y=S.origEl.y+dy;el.w=Math.max(10,S.origEl.w-dx);el.h=Math.max(10,S.origEl.h-dy);}renderElements();updateProps();}
}
function onPointerUp(){if(S.isDragging){S.isDragging=false;S.origEl=null;updateProps();}if(S.isResizing){S.isResizing=false;S.origEl=null;updateProps();}}

function onCanvasPointerDown(e){
    const pos=eventToPage(e);
    if(S.activeTool==='select'){const hit=hitTestDrawElements(pos);if(hit){S.selectedId=hit.id;renderElements();updateProps();return;}S.selectedId=null;renderElements();updateProps();return;}
    if(S.activeTool==='edittext'){const hit=hitTestDrawElements(pos);if(hit){S.selectedId=hit.id;renderElements();updateProps();return;}S.selectedId=null;renderElements();updateProps();return;}
    if(S.activeTool==='text'){createTextElement(pos);return;}
    if(S.activeTool==='draw'||S.activeTool==='highlight'){S.isDrawing=true;S.drawPoints=[pos];overlayCanvas.setPointerCapture(e.pointerId);return;}
    if(S.activeTool==='shape'||S.activeTool==='whiteout'){S.isDragging=true;S.dragStart=pos;S._shapeEnd=pos;overlayCanvas.setPointerCapture(e.pointerId);return;}
}
function onCanvasPointerMove(e){
    const pos=eventToPage(e);
    if(S.isDrawing){S.drawPoints.push(pos);renderOverlay();return;}
    if(S.isDragging&&(S.activeTool==='shape'||S.activeTool==='whiteout')){S._shapeEnd=pos;renderOverlay();}
}
function onCanvasPointerUp(e){
    const pos=eventToPage(e);
    if(S.isDrawing){S.isDrawing=false;if(S.drawPoints.length>1){pushUndo();S.elements.push({id:S.nextId(),type:S.activeTool==='highlight'?'highlight':'draw',page:S.page,points:[...S.drawPoints],color:S.activeTool==='highlight'?'#FFEB3B':S._drawColor,width:S.activeTool==='highlight'?16:S._drawWidth,opacity:S.activeTool==='highlight'?0.4:1});}S.drawPoints=[];renderPage();return;}
    if(S.isDragging&&S.activeTool==='shape'&&S.dragStart){S.isDragging=false;const x1=S.dragStart.x,y1=S.dragStart.y,x2=pos.x,y2=pos.y;if(Math.abs(x2-x1)>3||Math.abs(y2-y1)>3){pushUndo();S.elements.push({id:S.nextId(),type:'shape',page:S.page,shapeType:S.shapeType,x:Math.min(x1,x2),y:Math.min(y1,y2),w:Math.abs(x2-x1),h:Math.abs(y2-y1),fillColor:S._fillColor,strokeColor:S._strokeColor,strokeWidth:S._strokeWidth,fillOpacity:1,opacity:1,rotation:0});}S.dragStart=null;S._shapeEnd=null;renderPage();return;}
    if(S.isDragging&&S.activeTool==='whiteout'&&S.dragStart){S.isDragging=false;const x1=S.dragStart.x,y1=S.dragStart.y,x2=pos.x,y2=pos.y;if(Math.abs(x2-x1)>3||Math.abs(y2-y1)>3){pushUndo();S.elements.push({id:S.nextId(),type:'whiteout',page:S.page,x:Math.min(x1,x2),y:Math.min(y1,y2),w:Math.abs(x2-x1),h:Math.abs(y2-y1),fillColor:'#ffffff',opacity:1});}S.dragStart=null;S._shapeEnd=null;renderPage();return;}
}

function hitTestDrawElements(pos){
    const els=pageElements().filter(e=>e.type==='draw'||e.type==='highlight');
    for(let i=els.length-1;i>=0;i--){const el=els[i];const xs=el.points.map(p=>p.x),ys=el.points.map(p=>p.y);const bx=Math.min(...xs)-5,by=Math.min(...ys)-5;if(pos.x>=bx&&pos.x<=Math.max(...xs)+5&&pos.y>=by&&pos.y<=Math.max(...ys)+5)return el;}
    return null;
}

/* ===== CREATE TEXT ===== */
function createTextElement(pos){
    pushUndo();
    const el={id:S.nextId(),type:'text',page:S.page,x:pos.x,y:pos.y,w:150,h:30,text:'Type here',fontFamily:'Helvetica',fontSize:16,bold:false,italic:false,underline:false,color:S._drawColor,align:'left',lineHeight:1.3,opacity:1,rotation:0};
    S.elements.push(el);S.selectedId=el.id;setTool('select');renderElements();updateProps();
    setTimeout(()=>{const box=elOverlay.querySelector('[data-id="'+el.id+'"]');if(box)startTextEdit(el,box);},50);

function startTextEdit(el,box){
    const inner=box.querySelector('div');if(!inner)return;
    inner.style.pointerEvents='auto';inner.contentEditable='true';inner.focus();
    const range=document.createRange();range.selectNodeContents(inner);window.getSelection().removeAllRanges();window.getSelection().addRange(range);
    inner.addEventListener('blur',()=>{inner.contentEditable='false';inner.style.pointerEvents='none';el.text=inner.textContent;},{once:true});
    inner.addEventListener('input',()=>{el.text=inner.textContent;});
}
elOverlay.addEventListener('dblclick',e=>{const box=e.target.closest('.el-box');if(!box)return;const el=elById(parseInt(box.dataset.id));if(el&&el.type==='text')startTextEdit(el,box);});

/* ===== IMAGE UPLOAD ===== */
function triggerImageUpload(){
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.addEventListener('change',async()=>{if(!inp.files[0])return;const file=inp.files[0];const url=await fileToDataUrl(file);const dim=await getImageDimensions(url);let w=dim.w,h=dim.h;const mx=200;if(w>mx||h>mx){const r=Math.min(mx/w,mx/h);w*=r;h*=r;}pushUndo();S.elements.push({id:S.nextId(),type:'image',page:S.page,x:50,y:50,w,h,dataUrl:url,opacity:1,rotation:0,aspectRatio:dim.w/dim.h});S.selectedId=S.elements[S.elements.length-1].id;setTool('select');renderElements();updateProps();});
    inp.click();
}
function fileToDataUrl(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file);});}
function getImageDimensions(url){return new Promise(r=>{const img=new Image();img.onload=()=>r({w:img.width,h:img.height});img.src=url;});}

/* ===== SIGNATURE MODAL ===== */
const signCanvas=$('signCanvas'),signCtx=signCanvas.getContext('2d');let signDrawing=false,signHasStroke=false;
signCanvas.addEventListener('pointerdown',e=>{signDrawing=true;signHasStroke=true;const r=signCanvas.getBoundingClientRect();signCtx.beginPath();signCtx.moveTo((e.clientX-r.left)*signCanvas.width/r.width,(e.clientY-r.top)*signCanvas.height/r.height);signCanvas.setPointerCapture(e.pointerId);});
signCanvas.addEventListener('pointermove',e=>{if(!signDrawing)return;const r=signCanvas.getBoundingClientRect();signCtx.lineWidth=2;signCtx.lineCap='round';signCtx.strokeStyle='#000';signCtx.lineTo((e.clientX-r.left)*signCanvas.width/r.width,(e.clientY-r.top)*signCanvas.height/r.height);signCtx.stroke();});
signCanvas.addEventListener('pointerup',()=>{signDrawing=false;});
$('signClear').addEventListener('click',()=>{signCtx.clearRect(0,0,signCanvas.width,signCanvas.height);signHasStroke=false;});
document.querySelectorAll('.sign-tabs button').forEach(btn=>{btn.addEventListener('click',()=>{S.signTab=btn.dataset.tab;document.querySelectorAll('.sign-tabs button').forEach(b=>b.classList.toggle('active',b===btn));$('signDrawTab').style.display=S.signTab==='draw'?'':'none';$('signTypeTab').style.display=S.signTab==='type'?'':'none';$('signUploadTab').style.display=S.signTab==='upload'?'':'none';});});

function openSignModal(){$('signModal').classList.add('open');signCtx.clearRect(0,0,signCanvas.width,signCanvas.height);signHasStroke=false;$('signTypeInput').value='';$('signUploadPreview').style.display='none';S.signData=null;}

/* ===== PROPERTIES PANEL ===== */
function updateProps(){
    const el=S.selectedId?elById(S.selectedId):null;
    if(!el){propsPanel.innerHTML=getDefaultProps();return;}
    if(el.type==='text') propsPanel.innerHTML=getTextProps(el);
    else if(el.type==='image'||el.type==='signature') propsPanel.innerHTML=getImageProps(el);
    else if(el.type==='shape') propsPanel.innerHTML=getShapeProps(el);
    else if(el.type==='draw'||el.type==='highlight') propsPanel.innerHTML=getDrawProps(el);
    else if(el.type==='whiteout') propsPanel.innerHTML=getWhiteoutProps(el);
    else propsPanel.innerHTML=getDefaultProps();
    bindPropEvents(el);
}

function getDefaultProps(){
    return '<h3>Properties</h3><p class="hint">Select a tool from the toolbar, then click on the PDF to add elements.</p>'+
        '<p class="hint" style="margin-top:12px"><b>Shortcuts:</b><br>V - Select<br>T - Text<br>D - Draw<br>H - Highlight<br>S - Shape<br>W - Whiteout<br>I - Image<br>Del - Delete<br>Ctrl+Z / Y - Undo/Redo</p>';
}

function colorGrid(sel,id){
    let h='<div class="color-grid">';
    COLORS.forEach(c=>{h+='<div class="color-swatch'+(sel===c?' active':'')+'" data-color="'+c+'" data-target="'+id+'" style="background:'+c+'"></div>';});
    return h+'</div>';
}

function posFields(el){
    return '<div class="row2"><div class="pg"><label>X</label><input type="number" id="propX" value="'+Math.round(el.x)+'"></div><div class="pg"><label>Y</label><input type="number" id="propY" value="'+Math.round(el.y)+'"></div></div>';
}
function sizeFields(el){
    return '<div class="row2"><div class="pg"><label>Width</label><input type="number" id="propW" value="'+Math.round(el.w)+'"></div><div class="pg"><label>Height</label><input type="number" id="propH" value="'+Math.round(el.h)+'"></div></div>';
}
function opacityField(el){
    return '<div class="pg"><label>Opacity</label><input type="range" id="propOpacity" min="0" max="1" step="0.05" value="'+(el.opacity!==undefined?el.opacity:1)+'"></div>';
}
function rotationField(el){
    return '<div class="pg"><label>Rotation</label><input type="number" id="propRotation" value="'+(el.rotation||0)+'" min="-360" max="360" step="1"></div>';
}
function actionBtns(dup){
    return (dup?'<button class="pbtn" id="propDuplicate">Duplicate</button>':'')+
        '<button class="pbtn danger" id="propDelete">Delete Selected</button>';
}

function getTextProps(el){
    return '<h3>Properties</h3>'+
        '<div class="pg"><label>Text</label><textarea id="propText" rows="2">'+escHtml(el.text)+'</textarea></div>'+
        '<div class="pg"><label>Font</label><select id="propFont">'+['Helvetica','Times-Roman','Courier','Arial','Georgia','Verdana'].map(f=>'<option'+(el.fontFamily===f?' selected':'')+'>'+f+'</option>').join('')+'</select></div>'+
        '<div class="pg"><label>Size</label><input type="number" id="propFontSize" value="'+el.fontSize+'" min="6" max="120"></div>'+
        '<div class="style-row"><button id="propBold"'+(el.bold?' class="active"':'')+'><b>B</b></button><button id="propItalic"'+(el.italic?' class="active"':'')+'><i>I</i></button><button id="propUnderline"'+(el.underline?' class="active"':'')+'><u>U</u></button></div>'+
        '<div class="style-row"><button data-align="left"'+(el.align==='left'?' class="active"':'')+'>L</button><button data-align="center"'+((el.align||'')==='center'?' class="active"':'')+'>C</button><button data-align="right"'+((el.align||'')==='right'?' class="active"':'')+'>R</button></div>'+
        '<div class="pg"><label>Color</label></div>'+colorGrid(el.color||'#000000','propColor')+
        opacityField(el)+
        '<div class="pg"><label>Line Height</label><input type="range" id="propLineHeight" min="0.8" max="3" step="0.1" value="'+(el.lineHeight||1.3)+'"></div>'+
        posFields(el)+sizeFields(el)+rotationField(el)+
        actionBtns(true);
}

function getImageProps(el){
    const label=el.type==='signature'?'Signature':'Image';
    return '<h3>'+label+' Properties</h3>'+
        posFields(el)+sizeFields(el)+opacityField(el)+rotationField(el)+
        (el.type==='image'?'<button class="pbtn" id="propReplace">Replace Image</button>':'')+
        actionBtns(true);
}

function getShapeProps(el){
    return '<h3>Shape Properties</h3>'+
        '<div class="pg"><label>Fill</label></div>'+colorGrid(el.fillColor||'#ffffff','propFill')+
        '<div class="pg"><label>Fill Opacity</label><input type="range" id="propFillOpacity" min="0" max="1" step="0.05" value="'+(el.fillOpacity!==undefined?el.fillOpacity:1)+'"></div>'+
        '<div class="pg"><label>Stroke</label></div>'+colorGrid(el.strokeColor||'#000000','propStroke')+
        '<div class="pg"><label>Stroke Width</label><input type="number" id="propStrokeW" value="'+(el.strokeWidth||2)+'" min="0" max="20"></div>'+
        opacityField(el)+posFields(el)+sizeFields(el)+rotationField(el)+
        actionBtns(true);
}

function getDrawProps(el){
    const label=el.type==='highlight'?'Highlight':'Drawing';
    return '<h3>'+label+' Properties</h3>'+
        '<div class="pg"><label>Color</label></div>'+colorGrid(el.color||'#000','propColor')+
        '<div class="pg"><label>Stroke Width</label><input type="number" id="propDrawW" value="'+(el.width||2)+'" min="1" max="40"></div>'+
        '<div class="pg"><label>Opacity</label><input type="range" id="propOpacity" min="0" max="1" step="0.05" value="'+(el.opacity!==undefined?el.opacity:1)+'"></div>'+
        actionBtns(false);
}

function getWhiteoutProps(el){
    return '<h3>Whiteout Properties</h3>'+
        '<div class="pg"><label>Fill Color</label></div>'+colorGrid(el.fillColor||'#ffffff','propFill')+
        opacityField(el)+posFields(el)+sizeFields(el)+
        actionBtns(true)+
        '<p class="hint">Whiteout covers content visually. It does not securely redact underlying data from the PDF.</p>';
}

function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function bindPropEvents(el){
    if(!el) return;
    const on=(id,evt,fn)=>{const e=$(id);if(e)e.addEventListener(evt,fn);};
    const upd=()=>{renderElements();updateProps();updateUndoRedoState();};

    // Position
    on('propX','change',()=>{pushUndo();el.x=parseFloat($('propX').value)||0;upd();});
    on('propY','change',()=>{pushUndo();el.y=parseFloat($('propY').value)||0;upd();});
    // Size
    on('propW','change',()=>{pushUndo();el.w=Math.max(5,parseFloat($('propW').value)||10);upd();});
    on('propH','change',()=>{pushUndo();el.h=Math.max(5,parseFloat($('propH').value)||10);upd();});
    // Opacity
    on('propOpacity','input',()=>{el.opacity=parseFloat($('propOpacity').value);renderElements();});
    on('propOpacity','change',()=>{updateProps();});
    // Rotation
    on('propRotation','change',()=>{pushUndo();el.rotation=parseFloat($('propRotation').value)||0;upd();});

    // Text props
    on('propText','input',()=>{el.text=$('propText').value;renderElements();});
    on('propText','change',()=>{pushUndo();});
    on('propFont','change',()=>{pushUndo();el.fontFamily=$('propFont').value;upd();});
    on('propFontSize','change',()=>{pushUndo();el.fontSize=parseInt($('propFontSize').value)||16;upd();});
    on('propBold','click',()=>{pushUndo();el.bold=!el.bold;upd();});
    on('propItalic','click',()=>{pushUndo();el.italic=!el.italic;upd();});
    on('propUnderline','click',()=>{pushUndo();el.underline=!el.underline;upd();});
    on('propLineHeight','input',()=>{el.lineHeight=parseFloat($('propLineHeight').value);renderElements();});
    // Alignment
    propsPanel.querySelectorAll('[data-align]').forEach(btn=>{
        btn.addEventListener('click',()=>{pushUndo();el.align=btn.dataset.align;upd();});
    });

    // Shape props
    on('propStrokeW','change',()=>{pushUndo();el.strokeWidth=parseFloat($('propStrokeW').value)||0;upd();});
    on('propFillOpacity','input',()=>{el.fillOpacity=parseFloat($('propFillOpacity').value);renderElements();});

    // Draw props
    on('propDrawW','change',()=>{pushUndo();el.width=parseFloat($('propDrawW').value)||2;renderPage();updateUndoRedoState();});

    // Replace image
    on('propReplace','click',()=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.addEventListener('change',async()=>{if(!inp.files[0])return;pushUndo();el.dataUrl=await fileToDataUrl(inp.files[0]);upd();});inp.click();});

    // Duplicate
    on('propDuplicate','click',()=>{
        pushUndo();
        const clone=JSON.parse(JSON.stringify(el));
        clone.id=S.nextId(); clone.x+=15; clone.y+=15;
        S.elements.push(clone);
        S.selectedId=clone.id;
        upd();
    });

    // Delete
    on('propDelete','click',()=>{pushUndo();S.elements=S.elements.filter(e=>e.id!==el.id);S.selectedId=null;renderPage();updateProps();updateUndoRedoState();});

    // Color swatch clicks
    propsPanel.querySelectorAll('.color-swatch').forEach(sw=>{
        sw.addEventListener('click',()=>{
            const c=sw.dataset.color, t=sw.dataset.target;
            pushUndo();
            if(t==='propColor'){if(el.color!==undefined)el.color=c;S._drawColor=c;}
            else if(t==='propFill'){el.fillColor=c;S._fillColor=c;}
            else if(t==='propStroke'){el.strokeColor=c;S._strokeColor=c;}
            upd();
        });
    });
}

/* ===== PAGE NAVIGATION ===== */
$('prevPage').addEventListener('click',()=>{if(S.page>1){S.page--;S.selectedId=null;renderPage();updateProps();updateUndoRedoState();}});
$('nextPage').addEventListener('click',()=>{if(S.page<S.totalPages){S.page++;S.selectedId=null;renderPage();updateProps();updateUndoRedoState();}});
// Click page display to type page number
$('pageDisplay').style.cursor='pointer';
$('pageDisplay').addEventListener('click',()=>{
    const p=prompt('Go to page (1-'+S.totalPages+'):',S.page);
    if(p===null) return;
    const n=parseInt(p);
    if(n>=1&&n<=S.totalPages){S.page=n;S.selectedId=null;renderPage();updateProps();updateUndoRedoState();}
});

/* ===== ZOOM ===== */
$('zoomIn').addEventListener('click',()=>{S.zoom=Math.min(4,+(S.zoom+0.25).toFixed(2));renderPage();});
$('zoomOut').addEventListener('click',()=>{S.zoom=Math.max(0.25,+(S.zoom-0.25).toFixed(2));renderPage();});
$('zoomFit').addEventListener('click',async()=>{const ps=await getPageSize();const ww=workspace.clientWidth-40;S.zoom=Math.max(0.25,Math.min(4,+(ww/(ps.w*1.5)).toFixed(2)));renderPage();});

function updatePageUI(){
    $('prevPage').disabled=S.page<=1;
    $('nextPage').disabled=S.page>=S.totalPages;
    $('zoomLabel').textContent=Math.round(S.zoom*100)+'%';
    $('pageDisplay').textContent=S.page;
}

/* ===== UNDO/REDO BUTTONS ===== */
$('undoBtn').addEventListener('click',undo);
$('redoBtn').addEventListener('click',redo);

/* ===== KEYBOARD SHORTCUTS ===== */
document.addEventListener('keydown',e=>{
    if(!S.pdfDoc) return;
    const tag=e.target.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||e.target.contentEditable==='true') return;
    if(e.key==='Delete'||e.key==='Backspace'){if(S.selectedId){pushUndo();S.elements=S.elements.filter(el=>el.id!==S.selectedId);S.selectedId=null;renderPage();updateProps();}}
    if(e.key==='Escape'){S.selectedId=null;renderElements();updateProps();}
    if(e.ctrlKey||e.metaKey){if(e.key==='z'){e.preventDefault();undo();}if(e.key==='y'){e.preventDefault();redo();}}
    if(!e.ctrlKey&&!e.metaKey){
        if(e.key==='v')setTool('select');if(e.key==='t')setTool('text');if(e.key==='d')setTool('draw');
        if(e.key==='h')setTool('highlight');if(e.key==='s')setTool('shape');if(e.key==='w')setTool('whiteout');
        if(e.key==='i')triggerImageUpload();
    }
});

/* ===== RESET ===== */
$('resetBtn').addEventListener('click',resetEditor);
function resetEditor(){
    S.pdfBytes=null;S.pdfDoc=null;S.elements=[];S.selectedId=null;S.undoStack=[];S.redoStack=[];S.pageRotations={};
    document.body.classList.remove('editor-active');
    editorWrap.style.display='none';uploadArea.style.display='';
    output.style.display='none';ToolUtils.hideStatus(statusEl);fileInput.value='';
}

/* ===== SAVE & DOWNLOAD ===== */
$('saveBtn').addEventListener('click',async()=>{
    if(!S.pdfBytes) return;
    processing.style.display='flex';
    ToolUtils.hideStatus(statusEl);
    try{
        const pdfLibDoc=await PDFLib.PDFDocument.load(S.pdfBytes,{ignoreEncryption:true});
        const fonts={};
        async function getFont(family){if(fonts[family])return fonts[family];const map={'Helvetica':PDFLib.StandardFonts.Helvetica,'Times-Roman':PDFLib.StandardFonts.TimesRoman,'Courier':PDFLib.StandardFonts.Courier};fonts[family]=await pdfLibDoc.embedFont(map[family]||PDFLib.StandardFonts.Helvetica);return fonts[family];}

        for(const[pn,deg]of Object.entries(S.pageRotations)){if(!deg)continue;const pg=pdfLibDoc.getPage(parseInt(pn)-1);pg.setRotation(PDFLib.degrees(pg.getRotation().angle+deg));}

        const sorted=[...S.elements].sort((a,b)=>a.id-b.id);
        for(const el of sorted){
            const page=pdfLibDoc.getPage(el.page-1);const{width:pw,height:ph}=page.getSize();
            if(el.type==='text'){const font=await getFont(el.fontFamily||'Helvetica');const c=hexToRgb(el.color||'#000');page.drawText(el.text||'',{x:el.x,y:ph-el.y-(el.fontSize||16),size:el.fontSize||16,font,color:PDFLib.rgb(c.r,c.g,c.b),opacity:el.opacity!==undefined?el.opacity:1});}
            else if(el.type==='image'||el.type==='signature'){const b64=el.dataUrl.split(',')[1];const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let img;if(el.dataUrl.includes('image/png'))img=await pdfLibDoc.embedPng(bytes);else img=await pdfLibDoc.embedJpg(bytes);page.drawImage(img,{x:el.x,y:ph-el.y-el.h,width:el.w,height:el.h,opacity:el.opacity!==undefined?el.opacity:1});}
            else if(el.type==='shape'){const fc=hexToRgb(el.fillColor||'#fff'),sc=hexToRgb(el.strokeColor||'#000');if(el.shapeType==='rect'||el.shapeType==='roundrect'){page.drawRectangle({x:el.x,y:ph-el.y-el.h,width:el.w,height:el.h,color:PDFLib.rgb(fc.r,fc.g,fc.b),borderColor:PDFLib.rgb(sc.r,sc.g,sc.b),borderWidth:el.strokeWidth||2,opacity:el.fillOpacity!==undefined?el.fillOpacity:1});}else if(el.shapeType==='ellipse'){page.drawEllipse({x:el.x+el.w/2,y:ph-el.y-el.h/2,xScale:el.w/2,yScale:el.h/2,color:PDFLib.rgb(fc.r,fc.g,fc.b),borderColor:PDFLib.rgb(sc.r,sc.g,sc.b),borderWidth:el.strokeWidth||2,opacity:el.fillOpacity!==undefined?el.fillOpacity:1});}else{page.drawLine({start:{x:el.x,y:ph-el.y-el.h},end:{x:el.x+el.w,y:ph-el.y},thickness:el.strokeWidth||2,color:PDFLib.rgb(sc.r,sc.g,sc.b),opacity:el.opacity!==undefined?el.opacity:1});}}
            else if(el.type==='draw'||el.type==='highlight'){const c=hexToRgb(el.color||'#000');if(!el.points||el.points.length<2)continue;for(let i=0;i<el.points.length-1;i++){page.drawLine({start:{x:el.points[i].x,y:ph-el.points[i].y},end:{x:el.points[i+1].x,y:ph-el.points[i+1].y},thickness:el.width||2,color:PDFLib.rgb(c.r,c.g,c.b),opacity:el.opacity!==undefined?el.opacity:1});}}
            else if(el.type==='whiteout'){const c=hexToRgb(el.fillColor||'#fff');page.drawRectangle({x:el.x,y:ph-el.y-el.h,width:el.w,height:el.h,color:PDFLib.rgb(c.r,c.g,c.b),opacity:el.opacity!==undefined?el.opacity:1});}
        }

        const resultBytes=await pdfLibDoc.save();
        const blob=new Blob([resultBytes],{type:'application/pdf'});
        ToolUtils.downloadBlob(blob,S.fileName.replace('.pdf','')+'_edited.pdf');
        processing.style.display='none';
        ToolUtils.showStatus(statusEl,'PDF saved and downloaded successfully!','success');
    }catch(e){processing.style.display='none';ToolUtils.showStatus(statusEl,'Error: '+e.message,'error');console.error(e);}
});

function hexToRgb(hex){return{r:parseInt(hex.slice(1,3),16)/255,g:parseInt(hex.slice(3,5),16)/255,b:parseInt(hex.slice(5,7),16)/255};}

})();
</script>
