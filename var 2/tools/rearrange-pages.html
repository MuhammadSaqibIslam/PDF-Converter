<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rearrange Pages - PDF Flare</title>
    <link rel="stylesheet" href="../css/page-v2.css">
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>

<main><section class="tool-page"><div class="container">
    <a href="../v2.html" class="pf-tool-back">&larr; Back to All Tools</a>
    <div class="tool-header"><h1>Rearrange Pages</h1><p>Upload a PDF and specify a new page order to rearrange the document.</p></div>

    <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept=".pdf">
        <div class="upload-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
        <p class="upload-text">Drop a PDF file here or click to browse</p>
    </div>

    <div id="fileInfo" class="file-info" style="display:none;">
        <div id="fileItem"></div>
    </div>

    <div id="controls" style="display:none; margin-top:1.5rem;">
        <div class="tool-options">
            <div class="option-group">
                <label for="pageOrder">New page order (comma-separated, e.g. 3,1,2,4):</label>
                <input type="text" id="pageOrder" class="tool-input" placeholder="e.g. 3, 1, 2, 4">
            </div>
            <p id="pageCountInfo" style="margin-top:0.5rem; color: var(--text-secondary);"></p>
            <button class="tool-btn" id="processBtn" style="margin-top:1rem;">Rearrange Pages</button>
        </div>
    </div>

    <div class="processing" id="processing"><div class="spinner"></div><p class="processing-text">Processing...</p></div>
    <div id="status" class="status-msg"></div>
    <div class="output-area" id="output" style="display:none;"></div>
</div></section></main>
<script src="../js/tool-common.js"></script>
<script>
(function() {
    const { showStatus, hideStatus, downloadBlob, setupDragDrop, createFileItem, formatFileSize } = ToolUtils;
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const controls = document.getElementById('controls');
    const processing = document.getElementById('processing');
    const output = document.getElementById('output');
    const pageCountInfo = document.getElementById('pageCountInfo');
    const processBtn = document.getElementById('processBtn');
    const fileInfo = document.getElementById('fileInfo');
    const fileItem = document.getElementById('fileItem');

    let pdfBytes = null;
    let totalPages = 0;
    let fileName = '';

    setupDragDrop(uploadArea, fileInput, handleFile);
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

    async function handleFile(file) {
        if (file.type !== 'application/pdf') {
            showStatus('Please select a valid PDF file.', 'error');
            return;
        }
        hideStatus();
        fileName = file.name;
        pdfBytes = await file.arrayBuffer();
        try {
            const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
            totalPages = pdfDoc.getPageCount();
            const defaultOrder = Array.from({length: totalPages}, (_, i) => i + 1).join(', ');
            document.getElementById('pageOrder').placeholder = 'e.g. ' + defaultOrder;
            pageCountInfo.textContent = 'This PDF has ' + totalPages + ' page(s). Enter all page numbers in your desired order.';
            fileItem.innerHTML = '';
            fileItem.appendChild(createFileItem(file.name, formatFileSize(file.size)));
            fileInfo.style.display = 'block';
            controls.style.display = 'block';
            output.style.display = 'none';
        } catch(e) {
            showStatus('Failed to read PDF: ' + e.message, 'error');
        }
    }

    processBtn.addEventListener('click', async () => {
        const input = document.getElementById('pageOrder').value.trim();
        if (!input) { showStatus('Please enter the new page order.', 'error'); return; }

        const order = input.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
        if (order.length === 0) { showStatus('Invalid page numbers.', 'error'); return; }

        for (const p of order) {
            if (p < 1 || p > totalPages) {
                showStatus('Page ' + p + ' is out of range (1-' + totalPages + ').', 'error');
                return;
            }
        }

        hideStatus();
        processing.style.display = 'flex';

        try {
            const srcDoc = await PDFLib.PDFDocument.load(pdfBytes);
            const newDoc = await PDFLib.PDFDocument.create();
            const indices = order.map(p => p - 1);
            const copiedPages = await newDoc.copyPages(srcDoc, indices);
            copiedPages.forEach(page => newDoc.addPage(page));
            const resultBytes = await newDoc.save();
            const blob = new Blob([resultBytes], { type: 'application/pdf' });
            const newName = fileName.replace('.pdf', '') + '_rearranged.pdf';

            processing.style.display = 'none';
            output.style.display = 'block';
            output.innerHTML = '<p>Pages rearranged successfully. New order: ' + order.join(', ') + '</p>' +
                '<button class="tool-btn" id="downloadBtn">Download PDF</button>';
            document.getElementById('downloadBtn').addEventListener('click', () => downloadBlob(blob, newName));
            showStatus('Pages rearranged successfully!', 'success');
        } catch(e) {
            processing.style.display = 'none';
            showStatus('Error processing PDF: ' + e.message, 'error');
        }
    });
})();
</script>
<script src="../js/tool-common.js"></script>
<script src="../js/nav-v2.js"></script>
</body>
</html>
