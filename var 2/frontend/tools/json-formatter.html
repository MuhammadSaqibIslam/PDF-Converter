<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter - PDF Forge</title>
    <link rel="stylesheet" href="../css/page-v2.css">
    
</head>
<body>

    <main class="tool-page container">
        <a href="../v2.html" class="pf-tool-back">&larr; Back to All Tools</a>
        <h1>JSON Formatter</h1>
        <p>Paste your JSON and format it with proper indentation.</p>

        <div class="control-group">
            <label for="jsonInput">Input JSON</label>
            <textarea id="jsonInput" class="tool-textarea" rows="12" placeholder='{"name":"John","age":30,"city":"New York"}'></textarea>
        </div>

        <div class="control-group" style="display:flex;gap:10px;flex-wrap:wrap;">
            <button id="formatBtn" class="btn-tool">Format JSON</button>
            <button id="copyBtn" class="btn-secondary">Copy</button>
            <button id="downloadBtn" class="btn-secondary">Download</button>
            <button id="clearBtn" class="btn-secondary">Clear</button>
        </div>

        <div id="statusMsg" class="status-msg"></div>

        <div class="output-area">
            <label>Formatted Output</label>
            <pre class="output-content" id="output"></pre>
        </div>

        <div class="copy-feedback" id="copyFeedback">Copied to clipboard!</div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 PDF Forge. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/tool-common.js"></script>
    <script>
        const jsonInput = document.getElementById('jsonInput');
        const output = document.getElementById('output');
        const statusMsg = document.getElementById('statusMsg');
        const copyFeedback = document.getElementById('copyFeedback');

        document.getElementById('formatBtn').addEventListener('click', function() {
            const raw = jsonInput.value.trim();
            if (!raw) {
                ToolUtils.showStatus(statusMsg, 'Please enter some JSON.', 'error');
                output.textContent = '';
                return;
            }
            try {
                const parsed = JSON.parse(raw);
                const formatted = JSON.stringify(parsed, null, 2);
                output.textContent = formatted;
                ToolUtils.showStatus(statusMsg, 'JSON formatted successfully!', 'success');
            } catch (e) {
                output.textContent = '';
                ToolUtils.showStatus(statusMsg, 'Invalid JSON: ' + e.message, 'error');
            }
        });

        document.getElementById('copyBtn').addEventListener('click', function() {
            const text = output.textContent;
            if (!text) {
                ToolUtils.showStatus(statusMsg, 'Nothing to copy. Format JSON first.', 'error');
                return;
            }
            ToolUtils.copyToClipboard(text, copyFeedback);
        });

        document.getElementById('downloadBtn').addEventListener('click', function() {
            const text = output.textContent;
            if (!text) {
                ToolUtils.showStatus(statusMsg, 'Nothing to download. Format JSON first.', 'error');
                return;
            }
            ToolUtils.downloadText(text, 'formatted.json', 'application/json');
        });

        document.getElementById('clearBtn').addEventListener('click', function() {
            jsonInput.value = '';
            output.textContent = '';
            ToolUtils.hideStatus(statusMsg);
        });
    </script>
<script src="../js/tool-common.js"></script>
<script src="../js/nav-v2.js"></script>
</body>
</html>
