<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID Generator - PDF Forge</title>
    <link rel="stylesheet" href="../css/page-v2.css">
    
</head>
<body>

    <main class="tool-page container">
        <a href="../v2.html" class="pf-tool-back">&larr; Back to All Tools</a>
        <h1>UUID Generator</h1>
        <p>Generate random UUIDs (v4) instantly.</p>

        <div class="control-group" style="display:flex;gap:15px;align-items:end;flex-wrap:wrap;">
            <div>
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" min="1" max="100" value="1" style="width:80px;padding:8px;border:1px solid #ccc;border-radius:6px;">
            </div>
            <div style="display:flex;gap:10px;">
                <label style="display:flex;align-items:center;gap:5px;cursor:pointer;">
                    <input type="checkbox" id="uppercase"> Uppercase
                </label>
                <label style="display:flex;align-items:center;gap:5px;cursor:pointer;">
                    <input type="checkbox" id="noDashes"> No dashes
                </label>
            </div>
        </div>

        <div class="control-group" style="display:flex;gap:10px;flex-wrap:wrap;">
            <button id="generateBtn" class="btn-tool">Generate UUIDs</button>
            <button id="copyBtn" class="btn-secondary">Copy All</button>
            <button id="clearBtn" class="btn-secondary">Clear</button>
        </div>

        <div id="statusMsg" class="status-msg"></div>

        <div class="output-area">
            <label>Generated UUIDs</label>
            <pre class="output-content" id="output"></pre>
        </div>

        <div class="copy-feedback" id="copyFeedback">Copied to clipboard!</div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 PDF Forge. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/tool-common.js"></script>
    <script>
        const output = document.getElementById('output');
        const statusMsg = document.getElementById('statusMsg');
        const copyFeedback = document.getElementById('copyFeedback');

        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                return crypto.randomUUID();
            }
            // Fallback
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        document.getElementById('generateBtn').addEventListener('click', function() {
            const qty = Math.min(100, Math.max(1, parseInt(document.getElementById('quantity').value) || 1));
            const upper = document.getElementById('uppercase').checked;
            const noDashes = document.getElementById('noDashes').checked;
            const uuids = [];
            for (let i = 0; i < qty; i++) {
                let uuid = generateUUID();
                if (noDashes) uuid = uuid.replace(/-/g, '');
                if (upper) uuid = uuid.toUpperCase();
                uuids.push(uuid);
            }
            output.textContent = uuids.join('\n');
            ToolUtils.showStatus(statusMsg, qty + ' UUID(s) generated!', 'success');
        });

        document.getElementById('copyBtn').addEventListener('click', function() {
            const text = output.textContent;
            if (!text) {
                ToolUtils.showStatus(statusMsg, 'Generate UUIDs first.', 'error');
                return;
            }
            ToolUtils.copyToClipboard(text, copyFeedback);
        });

        document.getElementById('clearBtn').addEventListener('click', function() {
            output.textContent = '';
            ToolUtils.hideStatus(statusMsg);
        });

        // Generate one on load
        document.getElementById('generateBtn').click();
    </script>
<script src="../js/tool-common.js"></script>
<script src="../js/nav-v2.js"></script>
</body>
</html>
