<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR PDF - PDF Forge</title>
    <link rel="stylesheet" href="../css/page-v2.css">
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>

<main><section class="tool-page"><div class="container">
    <a href="../v2.html" class="pf-tool-back">&larr; Back to All Tools</a>
    <div class="tool-header"><h1>OCR PDF</h1><p>Extract text from scanned PDF documents using Optical Character Recognition.</p></div>

    <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept=".pdf">
        <div class="upload-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
        <p class="upload-text">Drop a PDF file here or click to browse</p>
    </div>

    <div class="processing" id="processing"><div class="spinner"></div><p class="processing-text">Processing...</p></div>
    <div id="status" class="status-msg"></div>
    <div class="output-area" id="output" style="display:none;"></div>
</div></section></main>
<script src="../js/tool-common.js"></script>
<script>
(function() {
    const { showStatus, setupDragDrop } = ToolUtils;
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const output = document.getElementById('output');

    setupDragDrop(uploadArea, fileInput, handleFile);
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

    function handleFile(file) {
        if (file.type !== 'application/pdf') {
            showStatus('Please select a valid PDF file.', 'error');
            return;
        }
        output.style.display = 'block';
        output.innerHTML =
            '<div class="status-msg info" style="display:block;">' +
            '<h3 style="margin-bottom:0.75rem;">Browser Limitation</h3>' +
            '<p>OCR (Optical Character Recognition) requires machine learning models that are too large for browser-based processing. Accurate text recognition from scanned documents needs specialized engines with trained language models.</p>' +
            '<h4 style="margin:1rem 0 0.5rem;">Recommended Alternatives:</h4>' +
            '<ul style="margin:0.5rem 0; padding-left:1.5rem;">' +
            '<li><strong>Tesseract OCR</strong> (free, open-source) &mdash; The most widely used OCR engine. Install via package manager and run: <code>tesseract input.png output -l eng pdf</code></li>' +
            '<li><strong>Adobe Acrobat</strong> &mdash; Built-in OCR under Tools &rarr; Scan &amp; OCR &rarr; Recognize Text</li>' +
            '<li><strong>macOS Preview</strong> &mdash; Recent macOS versions can select text in scanned images via Live Text</li>' +
            '<li><strong>Google Drive</strong> &mdash; Upload a scanned PDF, right-click &rarr; Open with Google Docs (performs OCR automatically)</li>' +
            '<li><strong>OCRmyPDF</strong> (free, open-source) &mdash; Command-line tool: <code>ocrmypdf input.pdf output.pdf</code></li>' +
            '</ul>' +
            '<p style="margin-top:1rem;">These tools run OCR locally or securely in the cloud, with support for multiple languages and high accuracy.</p>' +
            '</div>';
        showStatus('OCR processing is not supported in the browser. See recommendations below.', 'info');
    }
})();
</script>
<script src="../js/tool-common.js"></script>
<script src="../js/nav-v2.js"></script>
</body>
</html>
